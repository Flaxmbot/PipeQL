name: PipeQL Polyglot Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish pipeql to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build & Publish WASM Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp README.md js/README.md
          wasm-pack build crates/pipeql-wasm --target web --out-dir ../../js/dist
          rm -f js/dist/.gitignore
          cd js
          npm ci
          npm run build
          npm pack
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public || echo "npm publish failed or token unauthenticated, package built"
          else
            echo "NPM_TOKEN not set, package built"
          fi
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-npm
          path: js/*.tgz

  publish-pypi:
    name: Publish pipeql to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Maturin
        run: pip install maturin
      - name: Build Wheel & Publish
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          cp README.md crates/pipeql-python/README.md
          maturin build --release -m crates/pipeql-python/Cargo.toml --sdist
          if [ -n "$MATURIN_PYPI_TOKEN" ]; then
            maturin publish -m crates/pipeql-python/Cargo.toml --skip-existing || echo "PyPI publish failed or token unauthenticated, wheel built"
          else
            echo "PYPI_TOKEN not set, wheel built"
          fi
      - name: Upload PyPI wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-pypi
          path: target/wheels/*

  build-release:
    name: Build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cli: pipeql-linux-x86_64
            cffi: libpipeql_cffi.so
          - os: macos-latest
            cli: pipeql-macos-x86_64
            cffi: libpipeql_cffi.dylib
          - os: windows-latest
            cli: pipeql-windows-x86_64.exe
            cffi: pipeql_cffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release -p pipeql-cli -p pipeql-cffi
      - name: Package Binaries
        shell: bash
        run: |
          mkdir -p release-dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/pipeql.exe release-dist/${{ matrix.cli }}
            cp target/release/pipeql_cffi.dll release-dist/${{ matrix.cffi }}
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp target/release/pipeql release-dist/${{ matrix.cli }}
            cp target/release/libpipeql_cffi.dylib release-dist/${{ matrix.cffi }}
          else
            cp target/release/pipeql release-dist/${{ matrix.cli }}
            cp target/release/libpipeql_cffi.so release-dist/${{ matrix.cffi }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: release-dist/*

  publish-crates-io:
    name: Publish pipeql-core to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish -p pipeql-core || echo "crates.io publish skipped or already exists"
          else
            echo "CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
          fi

  publish-go-proxy:
    name: Publish to Go Proxy (pkg.go.dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Trigger Go Proxy Indexing
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "Publishing Go module at version ${VERSION}"
          curl -s "https://proxy.golang.org/github.com/!flaxmbot/!pipe!q!l/go/@v/${VERSION}.info" || true

  package-c-sdk:
    name: Package C/C++ SDK Header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package C Header
        run: |
          mkdir -p c-sdk/include
          cp crates/pipeql-cffi/include/libpipeql.h c-sdk/include/
          cp README.md c-sdk/
          tar -czvf pipeql-c-sdk-header.tar.gz -C c-sdk .
      - name: Upload C SDK header artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-c-sdk
          path: pipeql-c-sdk-header.tar.gz

  github-release:
    name: GitHub Release
    needs: [build-release, publish-npm, publish-pypi, publish-crates-io, publish-go-proxy, package-c-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add AI System Prompt to Release Assets
        run: cp ai/system_prompt.md artifacts/pipeql-ai-system-prompt.md
      - name: List artifacts
        run: find artifacts -type f
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

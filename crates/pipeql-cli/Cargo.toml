[package]
name = "pipeql-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for PipeQL transpilation"

[[bin]]
name = "pipeql"
path = "src/main.rs"

[dependencies]
pipeql-core = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "pipeql-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core compiler for PipeQL - lexer, parser, AST, analyzer, and SQL codegen"
keywords = ["sql", "query", "compiler", "postgres", "sqlite"]
categories = ["database", "compilers", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "transpile"
harness = false

[package]
name = "pipeql-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for PipeQL - powering the @flaxmbot/pipeql JavaScript SDK"
publish = false

[lib]
name = "pipeql_wasm"
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled wasm-opt (bulk-memory era LLVM emits memory.fill/copy)
# fails to validate bulk-memory ops, breaking `wasm-pack build` in CI. Skip
# the wasm-opt pass entirely; the produced .wasm is valid and works the same.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
pipeql-core = { workspace = true, features = ["serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json.workspace = true
serde-wasm-bindgen = "0.6"

[package]
name = "pipeql-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for PipeQL - powering the @flaxmbot/pipeql JavaScript SDK"
publish = false

[lib]
name = "pipeql_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
pipeql-core = { workspace = true, features = ["serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json.workspace = true
serde-wasm-bindgen = "0.6"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0,60 L 800,60 M 0,120 L 800,120 M 0,180 L 800,180" stroke="#1e293b" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M 200,0 L 200,240 M 400,0 L 400,240 M 600,0 L 600,240" stroke="#1e293b" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Logo Mark Icon (Left) -->
  <g transform="translate(60, 45)">
    <!-- Pipeline Outer Hexagon Frame -->
    <polygon points="75,5 135,40 135,110 75,145 15,110 15,40" fill="none" stroke="url(#pipeGrad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Pipe Divider Bars (| | |) -->
    <line x1="48" y1="42" x2="48" y2="108" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <line x1="75" y1="32" x2="75" y2="118" stroke="#818cf8" stroke-width="7" stroke-linecap="round"/>
    <line x1="102" y1="42" x2="102" y2="108" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>

    <!-- Dataflow Nodes -->
    <circle cx="48" cy="75" r="5" fill="#ffffff"/>
    <circle cx="75" cy="75" r="6" fill="#ffffff"/>
    <circle cx="102" cy="75" r="5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <!-- "Pipe" -->
  <text x="230" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-2">Pipe</text>
  
  <!-- "QL" with Gradient -->
  <text x="415" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2" filter="url(#glow)">QL</text>

  <!-- Subtitle Tagline -->
  <text x="235" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="3">PIPELINED • POLYGLOT • INJECTION-SAFE</text>

  <!-- Dialect Pills (Right Side) -->
  <g transform="translate(640, 50)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Postgres</text>

    <rect x="0" y="36" width="100" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="50" y="54" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">SQLite</text>

    <rect x="0" y="72" width="100" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <text x="50" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">DuckDB</text>

    <rect x="0" y="108" width="100" height="28" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="50" y="126" font-family="sans-serif" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">MySQL</text>
  </g>
</svg>
